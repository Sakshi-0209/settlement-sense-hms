{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}Settlement Sense HMS{% endblock %}
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:#f5f7fb;
    font-family:Segoe UI;
}

.sidebar{

    width:250px;
    height:100vh;
    background:#0F172A;

    position:fixed;
    left:0;
    top:0;

    color:white;

    transition:.3s;
}

.logo{

    padding:25px;

    font-size:24px;
    font-weight:bold;

    text-align:center;

    border-bottom:1px solid #334155;
}

.logo i{

    color:#38BDF8;
}

.sidebar ul{

    list-style:none;

    padding:20px;
}

.sidebar ul li{

    margin:12px 0;
}

.sidebar ul li a{

    color:white;

    text-decoration:none;

    display:block;

    padding:12px;

    border-radius:10px;

    transition:.3s;
}

.sidebar ul li a:hover{

    background:#1E293B;

    padding-left:18px;
}

.main{

    margin-left:250px;
}

.navbar-custom{

    background:white;

    padding:15px 25px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.search{

    width:350px;
}

.content{

    padding:30px;
}

.card{

    border:none;

    border-radius:18px;

    box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.back-btn{

    margin-bottom:20px;
}

.footer{

    text-align:center;

    padding:20px;

    color:gray;
}

    </style>

</head>

<body>

<div class="sidebar">

<div class="logo">

<i class="fa-solid fa-hospital"></i>

HMS

</div>

<ul>

    <li>
        <a href="{% url 'dashboard' %}">
            <i class="fa-solid fa-gauge"></i>
            Dashboard
        </a>
    </li>

    <li>
        <a href="{% url 'patients' %}">
            <i class="fa-solid fa-user"></i>
            Patients
        </a>
    </li>

    <li>
        <a href="{% url 'doctors' %}">
            <i class="fa-solid fa-user-doctor"></i>
            Doctors
        </a>
    </li>

    <li>
        <a href="{% url 'wards' %}">
            <i class="fa-solid fa-building"></i>
            Wards
        </a>
    </li>

    <li>
        <a href="{% url 'beds' %}">
            <i class="fa-solid fa-bed"></i>
            Beds
        </a>
    </li>

    <li>
        <a href="{% url 'admissions' %}">
            <i class="fa-solid fa-hospital-user"></i>
            Admissions
        </a>
    </li>

    <li>
        <a href="{% url 'appointments' %}">
            <i class="fa-solid fa-calendar-check"></i>
            Appointments
        </a>
    </li>

    <li>
        <a href="{% url 'billing' %}">
            <i class="fa-solid fa-money-bill-wave"></i>
            Billing
        </a>
    </li>

    <li>
        <a href="{% url 'pharmacy' %}">
            <i class="fa-solid fa-capsules"></i>
            Pharmacy
        </a>
    </li>

    
    <li>
    <a href="{% url 'reports' %}">
        <i class="fa-solid fa-file-waveform"></i>
        Reports
    </a>
</li>

   <li>
    <a href="{% url 'logout' %}">
        <i class="fa-solid fa-arrow-right-from-bracket"></i>
        Logout
    </a>
</li>

</ul>

</div>


<div class="main">

<div class="navbar-custom">

<div>

<input class="form-control search"
placeholder="Search anything...">

</div>

<div>

<button class="btn btn-light">

<i class="fa-solid fa-bell"></i>

</button>

<button class="btn btn-light">

<i class="fa-solid fa-user"></i>

Admin

</button>

</div>

</div>

<div class="content">

<button onclick="history.back()" class="btn btn-secondary back-btn">

<i class="fa-solid fa-arrow-left"></i>

Back

</button>

{% block content %}

{% endblock %}

</div>

<div class="footer">

© 2026 Settlement Sense HMS

</div>

</div>

</body>

</html>
