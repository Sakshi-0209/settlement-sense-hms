{% extends "base.html" %}

{% block title %}
Edit Bed
{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-warning">

            <h3>Edit Bed</h3>

        </div>

        <div class="card-body">

            <form method="POST">

                {% csrf_token %}

                <div class="row">

                    {% for field in form %}

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            {{ field.label }}

                        </label>

                        {{ field }}

                        {% if field.errors %}
                            <div class="text-danger">
                                {{ field.errors }}
                            </div>
                        {% endif %}

                    </div>

                    {% endfor %}

                </div>

                <button class="btn btn-warning">

                    Update Bed

                </button>

                <a href="{% url 'beds' %}"
                   class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
