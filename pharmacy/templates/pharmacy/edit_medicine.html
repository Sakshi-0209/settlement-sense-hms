{% extends "base.html" %}

{% block title %}Edit Medicine{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="card shadow-sm">

        <div class="card-header bg-warning text-dark">
            <h4 class="mb-0">Edit Medicine</h4>
        </div>

        <div class="card-body">

            <form method="POST">

                {% csrf_token %}

                {% for field in form %}

                <div class="mb-3">

                    <label class="form-label">
                        {{ field.label }}
                    </label>

                    {{ field }}

                    {% if field.errors %}
                    <div class="text-danger mt-1">
                        {{ field.errors }}
                    </div>
                    {% endif %}

                </div>

                {% endfor %}

                <button type="submit" class="btn btn-success">
                    Update Medicine
                </button>

                <a href="{% url 'pharmacy' %}" class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
